services:
  database:
    image: postgres:17-alpine
    container_name: database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ibid_website
      POSTGRES_USER: ibid
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibid -d ibid_website"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
