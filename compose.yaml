name: ibid-website

services:
  db:
    image: postgres:17-alpine
    container_name: ibid-website-db
    restart: unless-stopped
    env_file:
      - ./api/.env
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibid} -d ${POSTGRES_DB:-ibid_website}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ibid-website-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4510:4510"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4510
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      WORKSPACE_ROOT: /app
      STATIC_PAGES_DIR: /app/public/pages
      MEDIA_DIR: /app/public/content-media
      PRERENDER_ROUTES_PATH: /app/src/prerender-routes.txt
    volumes:
      - ./public:/app/public
      - ./src/prerender-routes.txt:/app/src/prerender-routes.txt

volumes:
  postgres_data:
