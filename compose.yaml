services:
  postgres:
    image: postgres:17-alpine
    container_name: ibid-website-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:54330:5432"
    environment:
      POSTGRES_DB: ibid_website
      POSTGRES_USER: ibid
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibid -d ibid_website"]
      interval: 5s
      timeout: 5s
      retries: 5

  ibid-website-api:
    image: node:22-alpine
    container_name: ibid-website-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4510:4510"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4510/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
