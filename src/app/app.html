<div class="lang-indicator">
  <span>[{{ i18n.currentLangCode() }}]</span>
  <div class="lang-buttons">
    <button (click)="changeLanguage('pt')" [class.active]="i18n.currentLangCode() === 'pt'">PT</button>
    <button (click)="changeLanguage('en')" [class.active]="i18n.currentLangCode() === 'en'">EN</button>
    <button (click)="changeLanguage('es')" [class.active]="i18n.currentLangCode() === 'es'">ES</button>
    <button (click)="changeLanguage('fr')" [class.active]="i18n.currentLangCode() === 'fr'">FR</button>
  </div>
</div>

<router-outlet></router-outlet>
<app-global-alert></app-global-alert>
