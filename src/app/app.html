@if (globalState.isAdmin()) {
  <div class="admin-layout">
    <main class="admin-main">
      <div class="admin-page">
        <nav class="admin-breadcrumbs">
          <a routerLink="/" class="breadcrumb-logo">
            <span class="char">i</span><span class="char">b</span><span class="char">i</span><span class="char">d</span><span class="char">.</span>
          </a>
          <span class="breadcrumb-separator">/</span>
          <a routerLink="/admin" class="breadcrumb-item home">
            <span class="home-icon">🏠</span>
          </a>
          @if (globalState.adminLang()) {
            <span class="breadcrumb-separator">></span>
            <a [routerLink]="['/admin', globalState.adminLang()]" class="breadcrumb-item lang">
              {{ globalState.adminLang() | uppercase }}
            </a>
          }
          @if (globalState.adminAction()) {
            <span class="breadcrumb-separator">></span>
            <span class="breadcrumb-item action">
              {{ globalState.adminAction() | titlecase }}
            </span>
          }
        </nav>
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
} @else {
  <app-header></app-header>

  <main class="book-pages" [class.book-pages--cover]="globalState.isOnCover()" #contentVolume>
    <router-outlet></router-outlet>
  </main>

  <app-page-turn #pageTurn></app-page-turn>

  <app-footer [pageTurn]="pageTurn"></app-footer>

  <app-global-alert></app-global-alert>
}
