@if (pageData(); as data) {
<header class="page-header">
  <div class="page-number">{{ 'chapter' | translate }} {{ data.metadata?.location }}</div>
  <h1 class="page-title">{{ data.title }}</h1>
</header>

<article class="page-body drop-cap" [innerHTML]="data.content"></article>

@if (needsBlankPage()) {
<div class="page-blank"></div>
}
}
