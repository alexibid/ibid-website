@if (exitSections().length > 0) {
  <div class="book-sequence">
    @for (section of exitSections(); track section.id) {
      <section [id]="section.metadata?.location" class="debug-page" style="margin-bottom: 50px; border-bottom: 2px dashed #ccc; padding-bottom: 20px;">
        <small>Component: EXIT (Spread: {{ section.metadata?.location }})</small>
        <h1>{{ section.title }}</h1>
        <div class="content" [innerHTML]="section.content"></div>
      </section>
    }
  </div>
} @else {
  <p>Construindo a contra-capa e formulários...</p>
}
