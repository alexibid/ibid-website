<div class="admin-layout">
  <main class="admin-layout__main">
    <div class="admin-layout__page">
      <nav class="admin-breadcrumbs" aria-label="Admin breadcrumb">
        <a routerLink="/" class="admin-breadcrumbs__logo">
          <span class="admin-breadcrumbs__logo-char">i</span>
          <span class="admin-breadcrumbs__logo-char">b</span>
          <span class="admin-breadcrumbs__logo-char">i</span>
          <span class="admin-breadcrumbs__logo-char">d</span>
          <span class="admin-breadcrumbs__logo-char">.</span>
        </a>
        <span class="admin-breadcrumbs__separator">/</span>
        <a routerLink="/admin" class="admin-breadcrumbs__item admin-breadcrumbs__item--home">
          <span class="admin-breadcrumbs__icon">🏠</span>
        </a>
        @if (globalState.adminLang()) {
          <span class="admin-breadcrumbs__separator">></span>
          <a [routerLink]="['/admin', globalState.adminLang()]"
            class="admin-breadcrumbs__item admin-breadcrumbs__item--lang">
            {{ globalState.adminLang() | uppercase }}
          </a>
        }
        @if (globalState.adminAction()) {
          <span class="admin-breadcrumbs__separator">></span>
          <span class="admin-breadcrumbs__item admin-breadcrumbs__item--action">
            {{ globalState.adminAction() | titlecase }}
          </span>
        }
      </nav>
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
