<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <a routerLink="/" class="login-logo">
        <span class="char">i</span><span class="char">b</span><span class="char">i</span><span class="char">d</span><span class="char">.</span>
      </a>
      <h2>Admin Access</h2>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="admin@ibid.pt">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required>
        <span class="tip">Dica: 123</span>
      </div>

      @if (error()) {
        <div class="error-message">
          {{ error() }}
        </div>
      }

      <button type="submit" class="btn-login">Login</button>
    </form>
  </div>
</div>
