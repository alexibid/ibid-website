@if (pageData(); as data) {
@if (parts().cover) {
<div class="page-body" [websiteStaticHtml]="parts().cover"></div>
}

<header class="page-header">
  <div class="page-number">{{ 'chapter' | translate }} {{ data.metadata?.location }}</div>
  <h1 class="page-title">{{ data.title }}</h1>
</header>

<article class="page-body drop-cap" [websiteStaticHtml]="parts().body"></article>

@if (needsBlankPage()) {
<div class="page-blank"></div>
}
}
