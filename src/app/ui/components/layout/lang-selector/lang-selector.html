<div class="lang-selector-wrap" [class.open]="isLangMenuOpen()" (websiteClickOutside)="closeMenu()">
  <button
    type="button"
    class="action-btn lang-btn"
    (click)="toggleLangMenu()"
    [attr.aria-expanded]="isLangMenuOpen()"
  >
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <span class="sr-only">Change language: </span>
    <span class="current-lang">{{ i18n.currentLangCode() | uppercase }}</span>
  </button>

  <div class="lang-dropdown">
    @for (lang of languages; track lang) {
      <button
        type="button"
        class="lang-selector__option"
        (click)="changeLanguage(lang)"
        [class.active]="i18n.currentLangCode() === lang"
        [attr.aria-pressed]="i18n.currentLangCode() === lang"
      >
        {{ lang | uppercase }}
      </button>
    }
  </div>
</div>
