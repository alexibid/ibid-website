<div class="lang-selector-wrap" [class.open]="isLangMenuOpen()" (websiteClickOutside)="closeMenu()">
  <div class="action-btn lang-btn" role="button" tabindex="0" (click)="toggleLangMenu()" aria-label="Change language">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <span class="current-lang">{{ i18n.currentLangCode() | uppercase }}</span>
  </div>
  
  <div class="lang-dropdown">
    <a role="button" tabindex="0" style="display: block; padding: 12px 20px; cursor: pointer; text-align: center; text-decoration: none;" (click)="changeLanguage('pt')" [class.active]="i18n.currentLangCode() === 'pt'">PT</a>
    <a role="button" tabindex="0" style="display: block; padding: 12px 20px; cursor: pointer; text-align: center; text-decoration: none;" (click)="changeLanguage('en')" [class.active]="i18n.currentLangCode() === 'en'">EN</a>
    <a role="button" tabindex="0" style="display: block; padding: 12px 20px; cursor: pointer; text-align: center; text-decoration: none;" (click)="changeLanguage('es')" [class.active]="i18n.currentLangCode() === 'es'">ES</a>
    <a role="button" tabindex="0" style="display: block; padding: 12px 20px; cursor: pointer; text-align: center; text-decoration: none;" (click)="changeLanguage('fr')" [class.active]="i18n.currentLangCode() === 'fr'">FR</a>
  </div>
</div>
