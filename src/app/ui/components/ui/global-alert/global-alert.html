@if (alertData(); as alert) {
  <div class="global-alert-overlay">
    <div class="global-alert-dialog">
      <h2>{{ alert.title }}</h2>
      <p>{{ alert.message }}</p>
      
      <button (click)="closeAlert()">
        <!-- Fallback to 'Close' or the dictionary value if defined -->
        {{ alert.close }}
      </button>
    </div>
  </div>
}
