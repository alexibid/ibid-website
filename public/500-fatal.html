<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - System Error | IBID</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; font-size: 2.5rem; color: #1a1a1a; }
        p { font-size: 1.1rem; color: #666; line-height: 1.6; }
        .spinner {
            margin: 2rem auto; width: 40px; height: 40px;
            border: 4px solid #f3f3f3; border-top: 4px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        small { display: block; margin-top: 2rem; color: #aaa; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <p>Encontrámos uma dificuldade técnica a desenhar esta página.</p>
        <div class="spinner"></div>
        <p>A nossa equipa já foi notificada. Por favor tenta refrescar a página daqui a alguns segundos.</p>
        <small>IBID Server Infrastructure</small>
    </div>
</body>
</html>
